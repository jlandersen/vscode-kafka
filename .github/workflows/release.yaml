name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Publish target"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - vsce
          - ovsx

permissions:
  contents: write

jobs:
  # First, run CI to ensure everything passes
  ci:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build .vsix package
        run: npm run package

      - name: Run unit tests
        uses: coactions/setup-xvfb@v1
        with:
          run: npm test

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: npm run compile

      - name: Run integration tests
        uses: coactions/setup-xvfb@v1
        with:
          run: npm run test:integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  build-vsix:
    needs: [ci, integration-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: linux-x64
            npm_config_cpu: x64
            npm_config_os: linux
          - target: linux-arm64
            npm_config_cpu: arm64
            npm_config_os: linux
          - target: win32-x64
            npm_config_cpu: x64
            npm_config_os: win32
          - target: win32-arm64
            npm_config_cpu: arm64
            npm_config_os: win32
          - target: darwin-x64
            npm_config_cpu: x64
            npm_config_os: darwin
          - target: darwin-arm64
            npm_config_cpu: arm64
            npm_config_os: darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install
        env:
          npm_config_cpu: ${{ matrix.npm_config_cpu }}
          npm_config_os: ${{ matrix.npm_config_os }}

      - name: Build target-specific VSIX
        run: npx @vscode/vsce package --target "${{ matrix.target }}" -o "vscode-kafka-${{ matrix.target }}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: vscode-kafka-${{ matrix.target }}.vsix
          if-no-files-found: error

  smoke-test-vsix:
    needs: [build-vsix]
    runs-on: ubuntu-latest
    steps:
      - name: Download linux-x64 VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix-linux-x64
          path: vsix/linux-x64

      - name: Download linux-arm64 VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix-linux-arm64
          path: vsix/linux-arm64

      - name: Install VS Code CLI
        run: |
          wget -q https://update.code.visualstudio.com/latest/linux-deb-x64/stable -O vscode.deb
          sudo dpkg -i vscode.deb || sudo apt-get install -f -y
          rm -f vscode.deb

      - name: Smoke test installable linux-x64 VSIX
        run: |
          VSIX="$(find vsix/linux-x64 -name '*.vsix' -print -quit)"
          code --user-data-dir "$RUNNER_TEMP/vscode-user-data" --extensions-dir "$RUNNER_TEMP/vscode-extensions" --install-extension "$VSIX" --force
          code --user-data-dir "$RUNNER_TEMP/vscode-user-data" --extensions-dir "$RUNNER_TEMP/vscode-extensions" --list-extensions | grep '^jeppeandersen\.vscode-kafka$'

      - name: Validate non-host linux-arm64 artifact
        run: |
          VSIX="$(find vsix/linux-arm64 -name '*.vsix' -print -quit)"
          npx @vscode/vsce generate-manifest --packagePath "$VSIX" --out "$RUNNER_TEMP/linux-arm64.manifest"
          test -s "$RUNNER_TEMP/linux-arm64.manifest"

  publish:
    needs: [build-vsix, smoke-test-vsix]
    runs-on: ubuntu-latest
    env:
      PUBLISH_TARGET: ${{ github.event.inputs.publish_target || 'both' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: vsix
          merge-multiple: true

      - name: Build Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\] - " { capture = 1 }
            capture {
              if ($0 ~ "^## \\[" && $0 !~ "^## \\[" version "\\] - ") {
                exit
              }
              print
            }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if ! grep -q "^## \\[$VERSION\\] - " RELEASE_NOTES.md; then
            echo "No CHANGELOG.md section found for version $VERSION"
            exit 1
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: vsix/*.vsix

      - name: Publish to VSCode Marketplace
        if: ${{ env.PUBLISH_TARGET == 'vsce' || env.PUBLISH_TARGET == 'both' }}
        run: npx @vscode/vsce publish --packagePath $(find vsix -iname '*.vsix') -p "$VSCE_TOKEN"
        env:
          VSCE_TOKEN: ${{ secrets.VSCODE_MARKETPLACE_TOKEN }}

      - name: Publish to Open VSX
        if: ${{ env.PUBLISH_TARGET == 'ovsx' || env.PUBLISH_TARGET == 'both' }}
        run: npx ovsx@0.9.3 publish --packagePath $(find vsix -iname '*.vsix') -p "$OVSX_TOKEN"
        env:
          OVSX_TOKEN: ${{ secrets.OPENVSX_MARKETPLACE_TOKEN }}
